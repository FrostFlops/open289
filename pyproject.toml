[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open289"
dynamic = ["version"]
description = "Open CLI, Python library and MCP server for the Fluke 287/289 multimeter over a Fluke IR3000 FC Bluetooth LE adapter, made for AI agents"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["bleak>=0.22"]
keywords = ["fluke", "289", "287", "multimeter", "dmm", "ir3000", "bluetooth", "ble", "mcp", "agent", "measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://github.com/FrostFlops/open289"
Issues = "https://github.com/FrostFlops/open289/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-timeout"]

[project.scripts]
open289 = "open289.cli:main"
open289-mcp = "open289.mcp_server:main"

[tool.setuptools]
packages = ["open289"]

[tool.setuptools.dynamic]
version = {attr = "open289.__version__"}

[tool.pytest.ini_options]
markers = ["hw: needs a real IR3000 FC + Fluke 289 (run with: pytest -m hw)"]
addopts = "-m 'not hw'"
timeout = 180                 # pytest-timeout: a hung test fails with a stack dump instead of stalling CI
faulthandler_timeout = 120    # dump every thread's stack if a test runs this long
